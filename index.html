<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" content="#f0f2f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)" />
    <!-- Per-page SEO tags (title, description, canonical, Open Graph, Twitter,
         JSON-LD) are injected here by scripts/vite-seo.ts - for the home page at
         build/dev, and per route into experiments/{id}/index.html on build. -->
    <!-- seo:start -->
    <title>Archive of Experiments</title>
    <!-- seo:end -->
    <!-- Prevent flash of wrong theme before React hydrates -->
    <script>
      (function () {
        var s = localStorage.getItem("theme");
        var t =
          s === "dark" || s === "light"
            ? s
            : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
