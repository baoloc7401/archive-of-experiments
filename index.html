<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" content="#f0f2f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)" />
    <!-- Per-page SEO tags (title, description, canonical, Open Graph, Twitter,
         JSON-LD) are injected here by scripts/vite-seo.ts - for the home page at
         build/dev, and per route into experiments/{id}/index.html on build. -->
    <!-- seo:start -->
    <title>Archive of Experiments</title>
    <!-- seo:end -->
    <!-- Prevent flash of wrong theme before React hydrates -->
    <script>
      (function () {
        var s = localStorage.getItem("theme");
        var t =
          s === "dark" || s === "light"
            ? s
            : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <!-- JetBrains Mono is self-hosted (see src/index.css @font-face + public/fonts).
         Preload the same-origin latin weights used for first paint so the font
         download starts in parallel with the CSS instead of after it: 400 (body)
         and 700 (hero title / headings). %BASE_URL% is replaced by Vite. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/jetbrains-mono-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/jetbrains-mono-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
