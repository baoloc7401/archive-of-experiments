<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c6cfa" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#00f5c4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07080d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="90" y1="38" x2="166" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f5c4"/>
      <stop offset="1" stop-color="#7c6cfa"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#1d2030" stroke-width="3"/>

  <!-- spark / lightning bolt: experiment energy, gradient unites both accents -->
  <g transform="translate(38 38) scale(7.5)">
    <path fill="url(#bolt)" d="M7 2 L7 13 L10 13 L10 22 L17 10 L13 10 L17 2 Z"/>
  </g>
</svg>
