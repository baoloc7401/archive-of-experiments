<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#7c6cfa" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#00f5c4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#07080d" stop-opacity="0"/>
    </radialGradient>
    <!-- badge gradients (namespaced to avoid clashing with #glow above) -->
    <radialGradient id="badgeGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c6cfa" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#00f5c4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07080d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="90" y1="38" x2="166" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f5c4"/>
      <stop offset="1" stop-color="#7c6cfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="6" y="6" width="1188" height="618" rx="22" fill="none" stroke="#1d2030" stroke-width="2"/>

  <!-- brand badge: the new spark mark (256-tile icon scaled down to a ~96px badge) -->
  <g transform="translate(84 74) scale(0.375)">
    <rect width="256" height="256" rx="56" fill="#0a0b12"/>
    <rect width="256" height="256" rx="56" fill="url(#badgeGlow)"/>
    <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#1d2030" stroke-width="3"/>
    <g transform="translate(38 38) scale(7.5)">
      <path fill="url(#boltGrad)" d="M7 2 L7 13 L10 13 L10 22 L17 10 L13 10 L17 2 Z"/>
    </g>
  </g>

  <text x="200" y="132" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="700" fill="#5a6072" letter-spacing="1">baoloc7401 /</text>

  <text x="92" y="318" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="104" font-weight="700" fill="#eef1f8" letter-spacing="-2">Archive of</text>
  <text x="92" y="430" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="104" font-weight="700" fill="#eef1f8" letter-spacing="-2">Experiments</text>

  <text x="96" y="512" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="600" fill="#00f5c4">Interactive algorithm visualizations · built to learn</text>

  <!-- experiment tags -->
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600">
    <g transform="translate(96,556)">
      <rect width="152" height="44" rx="22" fill="#11131c" stroke="#262a3b"/>
      <text x="76" y="29" text-anchor="middle" fill="#a9b0c4">chess AI</text>
