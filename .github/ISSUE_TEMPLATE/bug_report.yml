name: Bug report
description: Something in an experiment is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more concrete the repro, the faster it gets fixed.
  - type: dropdown
    id: experiment
    attributes:
      label: Which experiment?
      description: Where did you hit the bug?
      options:
        - Chess
        - Pathfinding
        - Elevator Scheduling
        - Ant Colony Optimization
        - River Crossing
        - Minesweeper
        - Boids Flocking
        - L-Systems
        - Home / gateway
        - About / Contact page
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see go wrong?
      placeholder: The flock froze after I dragged the separation slider to max.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The boids should keep moving and just spread apart.
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A numbered list is perfect.
      placeholder: |
        1. Open the Boids experiment
        2. Drag separation to 100%
        3. Press run
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & OS
      description: e.g. Chrome 124 on Windows 11, Safari on iOS 17.
      placeholder: Firefox 126 / macOS 14
    validations:
      required: false
  - type: textarea
    id: debug-report
    attributes:
      label: Debug report (optional)
      description: >
        Some experiments have a "copy report" button in a debug panel.
        If the one you hit does, paste the report here - it captures the exact state.
      render: text
    validations:
      required: false
